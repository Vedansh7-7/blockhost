name: Test & build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # only used to attach files to a release on version tags

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - run: python -m pip install -r requirements.txt
      - name: Logic + end-to-end tests (real Minecraft server, fake Drive)
        run: python -u tests/test_logic.py --e2e

  build:
    name: Build (${{ matrix.label }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
            asset: BlockHost-Windows.exe
          - os: macos-15
            label: macos-apple-silicon
            asset: BlockHost-macOS-Apple-Silicon.zip
          - os: macos-15-intel
            label: macos-intel
            asset: BlockHost-macOS-Intel.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-build.txt

      - name: Build Windows exe
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name BlockHost --icon app/icon.ico --add-data "app/ui;ui" --paths app app/main.py
          Copy-Item dist/BlockHost.exe "${{ matrix.asset }}"

      - name: Build macOS app
        if: runner.os == 'macOS'
        run: |
          pyinstaller --noconfirm --clean --windowed --name BlockHost --icon app/icon.ico \
            --osx-bundle-identifier io.github.blockhost.launcher \
            --add-data "app/ui:ui" --paths app app/main.py
          # smoke test: the bundled binary must start and import everything
          test -x dist/BlockHost.app/Contents/MacOS/BlockHost
          ditto -c -k --keepParent dist/BlockHost.app "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: BlockHost-${{ matrix.label }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Attach to release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: BlockHost ${{ github.ref_name }}
          body: |
            ## Download for your computer
            | Your computer | File |
            |---|---|
            | **Windows** 10 / 11 | `BlockHost-Windows.exe` |
            | **Mac** with Apple chip (M1, M2, M3, M4) | `BlockHost-macOS-Apple-Silicon.zip` |
            | **Mac** with Intel chip (older Macs) | `BlockHost-macOS-Intel.zip` |

            Not sure which Mac you have? Apple menu → **About This Mac** → look for "Chip: Apple M…" or "Processor: Intel".

            **First launch:** Windows → *More info → Run anyway*. Mac → unzip, right-click BlockHost → *Open* → *Open*.
            Then **JOIN GROUP** with the `.bhgroup` file and password from your group owner. Changes: see CHANGELOG.md.
          files: |
            BlockHost-Windows.exe
            BlockHost-macOS-Apple-Silicon.zip
            BlockHost-macOS-Intel.zip
